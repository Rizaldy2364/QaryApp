<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Aplikasi Al-Qur'an, Jadwal Sholat, Doa Harian, dan Dzikir Pagi-Petang tanpa iklan." />
    <meta name="theme-color" content="#F7F5EC" id="theme-color-meta" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://equran.id" />
    <link rel="dns-prefetch" href="https://equran.id" />
    <link rel="icon" type="image/svg+xml" href="/qaryapp-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>QaryApp</title>
    <script>
      // Anti-flicker: kunci penyimpanan 'qaryapp:settings' (harus sama dengan SETTINGS_STORAGE_KEY di src/lib/storage)
      (function() {
        try {
          var raw = localStorage.getItem('qaryapp:settings');
          var settings = raw ? JSON.parse(raw) : null;
          var theme = settings && settings.theme ? settings.theme : 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var metaThemeColor = document.getElementById('theme-color-meta');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', isDark ? '#0E1A14' : '#F7F5EC');
          }
        } catch (e) {
          // Abaikan jika localStorage tidak dapat diakses
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 24px; text-align: center; font-family: sans-serif;">
        <h2>JavaScript Diperlukan</h2>
        <p>QaryApp membutuhkan JavaScript aktif di peramban Anda untuk dapat dijalankan.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
